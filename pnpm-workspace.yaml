packages:
  - 'packages/*'
  - 'examples/*'

# esbuild ships a platform binary that its install script fetches; tsup needs it.
# pnpm 11 replaced `onlyBuiltDependencies` with this allow-list map.
allowBuilds:
  esbuild: true

# Adapters declare frameworks as peer dependencies; keep the store strict so a
# package can never reach a dependency it did not declare. pnpm reads these
# here rather than from .npmrc, where npm only warned that it did not know them.
autoInstallPeers: false
strictPeerDependencies: false
resolutionMode: highest
