name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # Framework-free packages must stay framework-free (brief §6).
      - name: Dependency boundaries
        run: pnpm boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The examples are not part of the library — nothing under packages/ refers
      # to them and they are never published — but an example that stops
      # compiling is worse than no example, so CI builds all of them.
      - name: Example apps
        run: pnpm --filter "./examples/**" run typecheck && pnpm --filter "./examples/**" run build

      # The agent example is the one that can actually be *run* headlessly, and
      # running it exercises the whole control plane through the same interface
      # a model uses: discovery, two refusals, both §2 changes, a revert, and the
      # audit trail. No API key and no network — that is the point of it.
      - name: Agent example
        run: pnpm --filter @leyline-examples/agent-cli run demo
        env:
          NO_COLOR: '1'

      # The MCP mode is the one a local claude/codex drives, and the part of it
      # that is not already covered by packages/agent's adapter tests is the
      # wiring: that the process starts, that stdout carries clean JSON-RPC and
      # no stray logging, and that a refusal survives a real pipe as data.
      - name: Agent example over MCP
        run: pnpm --filter @leyline-examples/agent-cli run smoke
        env:
          NO_COLOR: '1'

  invariants:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A required gate, not an advisory one: a change to the schema or the
      # control plane that lacks a corresponding adversarial test does not
      # merge (AD14, brief §8).
      #
      # The project list covers every package holding an invariant suite, and
      # `tests/security.test.ts` fails if that stops being true — a gate that
      # silently stops running a suite is worse than no gate.
      - name: Adversarial invariant suites
        run: pnpm vitest run --project schema --project core --project agent --project dsl -t 'I1|I2|I3|I4|I5|I6|I7'

      # SECURITY.md names the suites behind each invariant. This checks the
      # naming in both directions, so neither the document nor the gate above
      # can drift from what actually ships.
      - name: Threat model matches the suites
        run: pnpm vitest run tests/security.test.ts

      # The audit trail cannot drift from reality (brief §8). Decision 0029
      # makes that a tested property rather than a structural guarantee, which
      # puts the test in the same required gate as the invariant suites.
      - name: Audit trail agreement
        run: pnpm vitest run --project core src/control/log.test.ts
